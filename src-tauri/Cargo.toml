[package]
name = "clipvault"
version = "1.0.1"
description = "ClipVault - a permanent, local-first clipboard archive for Windows"
authors = ["ClipVault"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipvault_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.23.1"
chrono = "0.4.45"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.9.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v4"] }
walkdir = "2.5.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"] }
zip = "4.2.0"
